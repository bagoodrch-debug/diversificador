name: Atualizar taxa CDI

on:
  schedule:
    # Uma vez por dia. O CDI muda muito pouco entre um dia e outro (só muda
    # de verdade quando o Copom se reúne, poucas vezes por ano), então não
    # há necessidade de atualizar com mais frequência que isso.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions
  push:
    branches: [main]
    paths:
      - "reserva/scripts/atualizar-taxa.mjs"
      - ".github/workflows/atualizar-taxa-cdi.yml"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar taxa CDI e gerar dados/taxas.json
        working-directory: reserva
        run: node scripts/atualizar-taxa.mjs

      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reserva/dados/taxas.json
          git diff --staged --quiet && echo "Sem mudanças." || git commit -m "chore: atualizar taxa CDI [skip ci]"
          git push
